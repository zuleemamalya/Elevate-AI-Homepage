document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 { margin: 0; padding: 0; background: var(--bg); color: var(--text); }\nhtml { scroll-behavior: smooth; }\nbody {\n  font-family: 'DM Sans', system-ui, sans-serif;\n  font-size: 16px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: hidden;\n}\n\na { color: inherit; text-decoration: none; }\nimg { max-width: 100%; display: block; }\nbutton { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }\n\n/* Type ------------------------------------------------------- */\n.h-display, .h-section, .eyebrow, .step-num, .stat-num {\n  font-family: 'Syne', sans-serif;\n  letter-spacing: -0.01em;\n}\n.h-display {\n  font-size: clamp(48px, 7.2vw, 104px);\n  font-weight: 700;\n  line-height: 0.98;\n  letter-spacing: -0.035em;\n  margin: 0;\n}\n.h-section {\n  font-size: clamp(36px, 4.8vw, 64px);\n  font-weight: 700;\n  line-height: 1.02;\n  letter-spacing: -0.025em;\n  margin: 0 0 20px;\n  max-width: 22ch;\n  text-wrap: balance;\n}\n.eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--blue);\n  margin-bottom: 22px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 28px; height: 1px;\n  background: var(--blue);\n}\n.lede {\n  font-size: clamp(16px, 1.35vw, 19px);\n  color: var(--text-dim);\n  max-width: 62ch;\n  line-height: 1.6;\n  text-wrap: pretty;\n}\n.accent-blue { color: var(--blue); }\n.accent-gold { color: var(--gold); }\n.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.04em; }\n\n/* Layout ----------------------------------------------------- */\n.wrap {\n  max-width: var(--maxw);\n  margin: 0 auto;\n  padding: 0 32px;\n  position: relative;\n}\nsection { position: relative; padding: 140px 0; }\nsection + section { border-top: 1px solid var(--line); }\n\n.section-head {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 60px;\n  align-items: end;\n  margin-bottom: 72px;\n}\n.section-head.single { grid-template-columns: 1fr; }\n@media (max-width: 860px) {\n  .section-head { grid-template-columns: 1fr; gap: 20px; margin-bottom: 48px; }\n  section { padding: 96px 0; }\n}\n\n/* Loader ----------------------------------------------------- */\n.loader {\n  position: fixed; inset: 0;\n  background: var(--bg);\n  z-index: 200;\n  display: grid; place-items: center;\n  transition: opacity .6s ease, visibility .6s;\n}\n.loader.hidden { opacity: 0; visibility: hidden; }\n.loader__mark {\n  font-family: 'Syne', sans-serif;\n  font-weight: 700;\n  font-size: 22px;\n  letter-spacing: 0.02em;\n  display: flex; align-items: center; gap: 14px;\n}\n.loader__bar {\n  width: 180px; height: 2px;\n  background: rgba(255,255,255,0.1);\n  position: relative; overflow: hidden;\n  margin-top: 18px;\n}\n.loader__bar::after {\n  content: \"\"; position: absolute; inset: 0;\n  background: linear-gradient(90deg, transparent, var(--blue), transparent);\n  animation: load 1.4s ease-in-out infinite;\n}\n@keyframes load { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }\n.loader__wrap { display:flex; flex-direction:column; align-items:center; }\n\n/* Navbar ----------------------------------------------------- */\n.nav {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 100;\n  transition: background .35s var(--ease), border-color .35s var(--ease), backdrop-filter .35s;\n  border-bottom: 1px solid transparent;\n}\n.nav.scrolled {\n  background: rgba(10,10,15,0.72);\n  backdrop-filter: blur(14px) saturate(150%);\n  -webkit-backdrop-filter: blur(14px) saturate(150%);\n  border-bottom-color: var(--line);\n}\n.nav__inner {\n  max-width: var(--maxw);\n  margin: 0 auto;\n  padding: 18px 32px;\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 24px;\n}\n.brand { display: flex; align-items: center; gap: 12px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }\n.brand__mark {\n  width: 32px; height: 32px;\n  background: linear-gradient(135deg, var(--blue) 0%, #0066CC 100%);\n  border-radius: 8px;\n  position: relative;\n  box-shadow: 0 0 24px rgba(0,168,255,0.35), inset 0 1px 0 rgba(255,255,255,0.25);\n}\n.brand__mark::after {\n  content: \"\"; position: absolute; inset: 6px;\n  background: var(--bg);\n  border-radius: 4px;\n  clip-path: polygon(50% 0, 100% 100%, 0 100%);\n}\n.nav__links { display: flex; gap: 36px; align-items: center; }\n.nav__links a {\n  font-size: 14px; color: var(--text-dim);\n  transition: color .2s;\n  position: relative;\n}\n.nav__links a:hover { color: var(--text); }\n.nav__links a::after {\n  content: \"\"; position: absolute;\n  left: 0; right: 100%; bottom: -6px;\n  height: 1px; background: var(--blue);\n  transition: right .3s var(--ease);\n}\n.nav__links a:hover::after { right: 0; }\n.nav__cta { padding: 10px 18px; }\n.nav__burger { display: none; flex-direction: column; gap: 5px; width: 44px; height: 44px; align-items: center; justify-content: center; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(255,255,255,0.02); transition: all .25s; }\n.nav__burger:hover { border-color: var(--blue); }\n.nav__burger span { width: 20px; height: 2px; background: var(--text); display: block; transition: transform .3s var(--ease), opacity .2s; transform-origin: center; }\n.nav.open .nav__burger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }\n.nav.open .nav__burger span:nth-child(2) { opacity: 0; }\n.nav.open .nav__burger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }\n\n@media (max-width: 900px) {\n  .nav__links { display: none; }\n  .nav__burger { display: flex; }\n  .nav__cta { display: none; }\n  .nav__inner { padding: 14px 20px; }\n  .brand span:last-child { font-size: 14px; }\n}\n\n/* Mobile drawer */\n.nav__drawer {\n  position: fixed; inset: 0;\n  background: rgba(8,8,12,0.96);\n  backdrop-filter: blur(20px);\n  -webkit-backdrop-filter: blur(20px);\n  z-index: 90;\n  display: none;\n  flex-direction: column;\n  justify-content: center;\n  align-items: flex-start;\n  padding: 90px 32px 40px;\n  opacity: 0;\n  transition: opacity .35s var(--ease);\n}\n.nav__drawer.show { display: flex; opacity: 1; }\n.nav__drawer a {\n  font-family: 'Syne', sans-serif;\n  font-size: 36px; font-weight: 600;\n  padding: 14px 0;\n  letter-spacing: -0.02em;\n  color: var(--text);\n  border-bottom: 1px solid var(--line);\n  width: 100%;\n  transition: color .2s;\n}\n.nav__drawer a:hover { color: var(--blue); }\n.nav__drawer .btn { margin-top: 28px; font-size: 15px; padding: 16px 22px; }\n\n/* Buttons ---------------------------------------------------- */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 16px 26px;\n  font-size: 14px; font-weight: 600;\n  letter-spacing: 0.02em;\n  border-radius: 999px;\n  transition: transform .25s var(--ease), box-shadow .25s, background .25s;\n  white-space: nowrap;\n  position: relative;\n  overflow: hidden;\n}\n.btn--primary {\n  background: var(--blue);\n  color: #051018;\n  box-shadow: 0 10px 30px -10px rgba(0,168,255,0.55), inset 0 1px 0 rgba(255,255,255,0.3);\n}\n.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -10px rgba(0,168,255,0.7); }\n.btn--ghost {\n  background: transparent;\n  color: var(--text);\n  border: 1px solid var(--line-strong);\n}\n.btn--ghost:hover { border-color: var(--blue); color: var(--blue); }\n.btn__arrow { transition: transform .25s var(--ease); }\n.btn:hover .btn__arrow { transform: translateX(4px); }\n\n/* Shimmer pulse CTA */\n.btn--shimmer {\n  background: linear-gradient(135deg, var(--blue) 0%, #0080D4 100%);\n  color: #fff;\n  padding: 22px 40px;\n  font-size: 16px;\n  position: relative;\n  box-shadow: 0 0 0 1px rgba(0,168,255,0.4), 0 20px 60px -20px rgba(0,168,255,0.7);\n}\n.btn--shimmer::before {\n  content: \"\"; position: absolute;\n  top: 0; left: -60%;\n  width: 50%; height: 100%;\n  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);\n  transform: skewX(-20deg);\n  animation: shimmer 2.8s ease-in-out infinite;\n}\n@keyframes shimmer {\n  0%, 100% { left: -60%; }\n  50% { left: 120%; }\n}\n.btn--shimmer::after {\n  content: \"\"; position: absolute; inset: -3px;\n  border-radius: 999px;\n  background: radial-gradient(closest-side, rgba(0,168,255,0.6), transparent 70%);\n  z-index: -1;\n  animation: pulse 2s ease-in-out infinite;\n}\n@keyframes pulse {\n  0%, 100% { opacity: .4; transform: scale(.98); }\n  50% { opacity: .9; transform: scale(1.04); }\n}\n\n/* Hero ------------------------------------------------------- */\n.hero {\n  min-height: 100vh;\n  padding: 160px 0 120px;\n  position: relative;\n  overflow: hidden;\n  border-top: 0;\n}\n.hero__bg {\n  position: absolute; inset: 0;\n  pointer-events: none;\n}\n#heroCanvas {\n  position: absolute; inset: 0;\n  width: 100%; height: 100%;\n}\n.hero__blob {\n  position: absolute;\n  width: 900px; height: 900px;\n  border-radius: 50%;\n  background:\n    radial-gradient(circle at 30% 30%, rgba(0,168,255,0.28), transparent 60%),\n    radial-gradient(circle at 70% 70%, rgba(255,215,0,0.12), transparent 55%);\n  filter: blur(80px);\n  top: -200px; right: -200px;\n  animation: blob 18s ease-in-out infinite alternate;\n}\n@keyframes blob {\n  0% { transform: translate(0,0) scale(1); }\n  50% { transform: translate(-80px, 60px) scale(1.1); }\n  100% { transform: translate(40px, -40px) scale(0.95); }\n}\n.hero__grid-fade {\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 50% 40%, transparent 0%, var(--bg) 75%),\n    linear-gradient(to bottom, transparent 60%, var(--bg) 100%);\n}\n.hero__inner {\n  position: relative; z-index: 2;\n  display: grid;\n  grid-template-columns: 1.2fr 1fr;\n  gap: 80px;\n  align-items: center;\n}\n@media (max-width: 1000px) { .hero__inner { grid-template-columns: 1fr; gap: 60px; } }\n\n.hero__tag {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 8px 14px;\n  border-radius: 999px;\n  background: rgba(0,168,255,0.08);\n  border: 1px solid rgba(0,168,255,0.25);\n  color: var(--blue);\n  font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;\n}\n.hero__tag .dot { width: 6px; height: 6px; background: var(--blue); border-radius: 50%; box-shadow: 0 0 10px var(--blue); animation: blink 2s ease-in-out infinite; }\n@keyframes blink { 50% { opacity: .3; } }\n\n.hero h1 { margin-top: 24px; }\n.hero h1 em {\n  font-style: normal;\n  background: linear-gradient(120deg, var(--blue) 0%, #7FD1FF 50%, var(--gold) 100%);\n  -webkit-background-clip: text; background-clip: text;\n  color: transparent;\n}\n.hero__sub {\n  margin-top: 28px;\n  font-size: clamp(17px, 1.5vw, 20px);\n  color: var(--text-dim);\n  max-width: 58ch;\n  line-height: 1.55;\n}\n.hero__ctas { margin-top: 40px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }\n.hero__tag-line {\n  margin-top: 28px; font-family: 'JetBrains Mono', monospace;\n  font-size: 13px; color: var(--text-mute);\n  letter-spacing: 0.02em;\n}\n.hero__tag-line strong { color: var(--text); font-weight: 500; }\n\n.hero__panel {\n  position: relative;\n  background: linear-gradient(180deg, rgba(23,23,34,0.9), rgba(14,14,21,0.6));\n  border: 1px solid var(--line-strong);\n  border-radius: var(--radius-lg);\n  padding: 28px;\n  backdrop-filter: blur(10px);\n  box-shadow: 0 40px 80px -40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);\n}\n.hero__panel::before {\n  content: \"\"; position: absolute; inset: 0;\n  border-radius: var(--radius-lg);\n  padding: 1px;\n  background: linear-gradient(160deg, rgba(0,168,255,0.4), transparent 40%, transparent 60%, rgba(255,215,0,0.25));\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor; mask-composite: exclude;\n  pointer-events: none;\n}\n.panel__head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line); }\n.panel__head h4 { margin: 0; font-family: 'Syne', sans-serif; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }\n.panel__status { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--blue); }\n.panel__status::before { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 10px var(--blue); animation: blink 1.6s infinite; }\n.panel__rows { margin-top: 20px; display: grid; gap: 14px; }\n.panel__row {\n  display: grid; grid-template-columns: 1fr auto;\n  gap: 14px;\n  padding: 14px 16px;\n  background: rgba(255,255,255,0.02);\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  align-items: center;\n  transition: border-color .25s, background .25s;\n}\n.panel__row:hover { border-color: rgba(0,168,255,0.4); background: rgba(0,168,255,0.04); }\n.panel__row .label { font-size: 13px; color: var(--text-dim); }\n.panel__row .value { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); }\n.panel__row .value.up { color: #00D68F; }\n.panel__row .value.up::before { content: \"▲ \"; font-size: 9px; }\n.panel__foot { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-mute); }\n\n/* Stagger reveal -------------------------------------------- */\n.reveal { opacity: 0; transform: translateY(32px); transition: opacity .9s var(--ease), transform .9s var(--ease); }\n.reveal.in { opacity: 1; transform: translateY(0); }\n.reveal.d1 { transition-delay: .08s; }\n.reveal.d2 { transition-delay: .16s; }\n.reveal.d3 { transition-delay: .24s; }\n.reveal.d4 { transition-delay: .32s; }\n.reveal.d5 { transition-delay: .40s; }\n.reveal.d6 { transition-delay: .48s; }\n\n/* Problem ---------------------------------------------------- */\n.problem-grid {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 16px;\n  margin-top: 40px;\n}\n@media (max-width: 1100px) { .problem-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 560px) { .problem-grid { grid-template-columns: 1fr; } }\n.problem-card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  padding: 24px 22px;\n  min-height: 200px;\n  display: flex; flex-direction: column; justify-content: space-between;\n  transition: transform .35s var(--ease), border-color .35s, background .35s, box-shadow .35s;\n  position: relative;\n  overflow: hidden;\n}\n.problem-card:hover {\n  transform: translateY(-4px);\n  border-color: rgba(0,168,255,0.35);\n  box-shadow: 0 20px 50px -20px rgba(0,168,255,0.4);\n}\n.problem-card .num {\n  font-family: 'Syne', sans-serif;\n  font-size: 12px; letter-spacing: 0.14em; color: var(--blue);\n  font-weight: 600;\n}\n.problem-card p {\n  margin: 16px 0 0;\n  font-size: 15px; line-height: 1.45; color: var(--text);\n}\n.problem-closer {\n  margin-top: 48px;\n  padding: 28px 32px;\n  border-left: 2px solid var(--gold);\n  font-size: clamp(18px, 1.8vw, 22px);\n  line-height: 1.45;\n  max-width: 72ch;\n  color: var(--text);\n}\n.problem-closer strong { color: var(--gold); font-weight: 500; }\n\n/* Solution --------------------------------------------------- */\n.outcomes {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 16px;\n  margin-top: 40px;\n}\n@media (max-width: 980px) { .outcomes { grid-template-columns: repeat(2,1fr); } }\n@media (max-width: 560px) { .outcomes { grid-template-columns: 1fr; } }\n.outcome {\n  background: linear-gradient(180deg, rgba(23,23,34,0.6), rgba(10,10,15,0.6));\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 32px 28px;\n  position: relative;\n  overflow: hidden;\n  transition: transform .35s var(--ease), border-color .35s, box-shadow .35s;\n}\n.outcome::before {\n  content: \"\"; position: absolute;\n  top: -40%; right: -40%;\n  width: 240px; height: 240px;\n  border-radius: 50%;\n  background: radial-gradient(circle, var(--blue-glow), transparent 70%);\n  opacity: 0;\n  transition: opacity .4s;\n}\n.outcome:hover { transform: translateY(-6px); border-color: var(--blue); box-shadow: 0 30px 60px -25px rgba(0,168,255,0.35); }\n.outcome:hover::before { opacity: 1; }\n.outcome__icon {\n  width: 48px; height: 48px;\n  border-radius: 12px;\n  background: rgba(0,168,255,0.1);\n  border: 1px solid rgba(0,168,255,0.3);\n  display: grid; place-items: center;\n  margin-bottom: 22px;\n  color: var(--blue);\n  position: relative; z-index: 1;\n}\n.outcome h3 {\n  font-family: 'Syne', sans-serif;\n  font-size: 22px;\n  font-weight: 600;\n  margin: 0 0 12px;\n  letter-spacing: -0.01em;\n  position: relative; z-index: 1;\n}\n.outcome p { margin: 0; color: var(--text-dim); font-size: 14.5px; line-height: 1.55; position: relative; z-index: 1; }\n\n/* Services --------------------------------------------------- */\n.services {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 0;\n  margin-top: 40px;\n  border-top: 1px solid var(--line);\n  border-left: 1px solid var(--line);\n}\n@media (max-width: 860px) { .services { grid-template-columns: 1fr; } }\n.service {\n  padding: 40px 36px 44px;\n  border-right: 1px solid var(--line);\n  border-bottom: 1px solid var(--line);\n  position: relative;\n  transition: background .35s;\n}\n.service:hover { background: rgba(0,168,255,0.03); }\n.service:hover .service__num { color: var(--blue); }\n.service__head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }\n.service__num {\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 12px;\n  color: var(--text-mute);\n  padding-top: 6px;\n  transition: color .25s;\n}\n.service__icon {\n  width: 44px; height: 44px;\n  border-radius: 10px;\n  background: rgba(25 pan class=\"check\">✓<\u002Fspan> Custom AI Solutions<\u002Fspan>\n      <span><span class=\"check\">✓<\u002Fspan> All Industries Welcome<\u002Fspan>\n      <span><span class=\"check\">✓<\u002Fspan> Ongoing Support Included<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot\">\n      <div class=\"foot__brand\">\n        <a href=\"#top\" class=\"brand\">\n          <span class=\"brand__mark\" aria-hidden=\"true\"><\u002Fspan>\n          <span>Elevate<span style=\"color:var(--blue)\">AI<\u002Fspan> <span style=\"color:var(--text-mute);font-weight:500;\">Growth Solutions<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n        <p>We Turn AI Into Your Unfair Advantage. Done-for-you AI implementation and automation for businesses ready to scale.<\u002Fp>\n      <\u002Fdiv>\n      <nav class=\"foot__nav\" aria-label=\"Footer\">\n        <a href=\"#top\">Home<\u002Fa>\n        <a href=\"#services\">Services<\u002Fa>\n        <a href=\"#how\">How It Works<\u002Fa>\n        <a href=\"#serve\">Who We Serve<\u002Fa>\n        <a href=\"#faq\">FAQ<\u002Fa>\n        <a href=\"#book\">Book A Strategy Session<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div class=\"foot__bottom\">\n      <span>© 2025 Elevate AI Growth Solutions. All Rights Reserved.<\u002Fspan>\n      <div class=\"foot__legal\">\n        <a href=\"mailto:hello@elevateaigrowthsolutions.com?subject=Book%20a%20Strategy%20Session&amp;body=Hi%20Elevate%20AI%20team%2C%0A%0AI%27d%20like%20to%20book%20a%20free%20AI%20Strategy%20Session.%0A%0AName%3A%0ABusiness%3A%0ABest%20contact%3A%0A%0AThanks!\">Privacy Policy<\u002Fa>\n        <a href=\"mailto:hello@elevateaigrowthsolutions.com?subject=Book%20a%20Strategy%20Session&amp;body=Hi%20Elevate%20AI%20team%2C%0A%0AI%27d%20like%20to%20book%20a%20free%20AI%20Strategy%20Session.%0A%0AName%3A%0ABusiness%3A%0ABest%20contact%3A%0A%0AThanks!\">Terms of Service<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n/* ============== ELEVATE AI — SCRIPTS ============== */\n\n// ---------- Loader ----------\nwindow.addEventListener('load', () => {\n  setTimeout(() => {\n    document.getElementById('loader')?.classList.add('hidden');\n  }, 900);\n});\n\n// ---------- Sticky nav on scroll ----------\nconst nav = document.getElementById('nav');\nconst onScroll = () => {\n  if (window.scrollY > 40) nav.classList.add('scrolled');\n  else nav.classList.remove('scrolled');\n};\nwindow.addEventListener('scroll', onScroll, { passive: true });\nonScroll();\n\n// ---------- Intersection Observer reveals ----------\nconst io = new IntersectionObserver((entries) => {\n  entries.forEach((e) => {\n    if (e.isIntersecting) {\n      e.target.classList.add('in');\n      // Trigger counters if present\n      if (e.target.hasAttribute('data-counter')) runCounter(e.target);\n    }\n  });\n}, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });\n\ndocument.querySelectorAll('.reveal, [data-counter]').forEach((el) => io.observe(el));\n\n// ---------- Counters ----------\nfunction runCounter(el) {\n  if (el.dataset.done) return;\n  el.dataset.done = '1';\n  const target = parseFloat(el.dataset.counter);\n  const decimals = parseInt(el.dataset.decimals || '0', 10);\n  const prefix = el.dataset.prefix || '';\n  const suffix = el.dataset.suffix || '';\n  const dur = 1600;\n  const t0 = performance.now();\n  const ease = (t) => 1 - Math.pow(1 - t, 3);\n  function tick(now) {\n    const p = Math.min(1, (now - t0) / dur);\n    const v = target * ease(p);\n    el.querySelector('.num-val').textContent = prefix + v.toFixed(decimals).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n    if (p < 1) requestAnimationFrame(tick);\n    else el.querySelector('.num-val').textContent = prefix + target.toFixed(decimals).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n  }\n  requestAnimationFrame(tick);\n}\n\n// ---------- FAQ accordion ----------\ndocument.querySelectorAll('.faq-item').forEach((item) => {\n  const q = item.querySelector('.faq-q');\n  const a = item.querySelector('.faq-a');\n  q.addEventListener('click', () => {\n    const isOpen = item.classList.contains('open');\n    // close others\n    document.querySelectorAll('.faq-item.open').forEach((o) => {\n      if (o !== item) {\n        o.classList.remove('open');\n        o.querySelector('.faq-a').style.maxHeight = '0px';\n      }\n    });\n    if (isOpen) {\n      item.classList.remove('open');\n      a.style.maxHeight = '0px';\n    } else {\n      item.classList.add('open');\n      a.style.maxHeight = a.scrollHeight + 'px';\n    }\n  });\n});\n\n// ---------- Hero canvas: cursor-reactive grid ----------\nconst canvas = document.getElementById('heroCanvas');\nif (canvas) {\n  const ctx = canvas.getContext('2d');\n  let w, h, dpr;\n  const mouse = { x: -9999, y: -9999, active: false };\n  const particles = [];\n\n  function resize() {\n    dpr = Math.min(window.devicePixelRatio || 1, 2);\n    const rect = canvas.getBoundingClientRect();\n    w = rect.width; h = rect.height;\n    canvas.width = w * dpr;\n    canvas.height = h * dpr;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    buildParticles();\n  }\n\n  function buildParticles() {\n    particles.length = 0;\n    const gap = 44;\n    const cols = Math.ceil(w / gap) + 1;\n    const rows = Math.ceil(h / gap) + 1;\n    for (let i = 0; i < cols; i++) {\n      for (let j = 0; j < rows; j++) {\n        particles.push({\n          x: i * gap,\n          y: j * gap,\n          bx: i * gap,\n          by: j * gap,\n          vx: 0, vy: 0\n        });\n      }\n    }\n  }\n\n  function draw() {\n    ctx.clearRect(0, 0, w, h);\n\n    // Subtle base grid lines\n    ctx.strokeStyle = 'rgba(255,255,255,0.035)';\n    ctx.lineWidth = 1;\n\n    for (let p of particles) {\n      // Cursor influence\n      const dx = p.bx - mouse.x;\n      const dy = p.by - mouse.y;\n      const dist = Math.sqrt(dx * dx + dy * dy);\n      const radius = 160;\n      let fx = 0, fy = 0;\n      if (dist < radius && mouse.active) {\n        const force = (1 - dist / radius) * 14;\n        fx = (dx / dist) * force;\n        fy = (dy / dist) * force;\n      }\n      const tx = p.bx + fx;\n      const ty = p.by + fy;\n      p.vx += (tx - p.x) * 0.08;\n      p.vy += (ty - p.y) * 0.08;\n      p.vx *= 0.72;\n      p.vy *= 0.72;\n      p.x += p.vx;\n      p.y += p.vy;\n\n      const displaced = Math.hypot(p.x - p.bx, p.y - p.by);\n      const glow = Math.min(1, displaced / 20);\n\n      // Dot\n      ctx.beginPath();\n      const r = 1 + glow * 1.6;\n      ctx.fillStyle = glow > 0.05\n        ? `rgba(0,168,255,${0.25 + glow * 0.65})`\n        : 'rgba(255,255,255,0.14)';\n      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);\n      ctx.fill();\n\n      if (glow > 0.3) {\n        ctx.beginPath();\n        ctx.fillStyle = `rgba(0,168,255,${glow * 0.15})`;\n        ctx.arc(p.x, p.y, 8 * glow, 0, Math.PI * 2);\n        ctx.fill();\n      }\n    }\n\n    requestAnimationFrame(draw);\n  }\n\n  window.addEventListener('resize', resize);\n  window.addEventListener('pointermove', (e) => {\n    const rect = canvas.getBoundingClientRect();\n    mouse.x = e.clientX - rect.left;\n    mouse.y = e.clientY - rect.top;\n    mouse.active = true;\n  });\n  window.addEventListener('pointerleave', () => { mouse.active = false; });\n\n  resize();\n  draw();\n}\n\n// ---------- Mobile drawer ----------\nconst burger = document.getElementById('burger');\nconst drawer = document.getElementById('drawer');\nif (burger && drawer) {\n  const closeDrawer = () => {\n    nav.classList.remove('open');\n    drawer.classList.remove('show');\n    document.body.style.overflow = '';\n  };\n  burger.addEventListener('click', () => {\n    const isOpen = nav.classList.toggle('open');\n    drawer.classList.toggle('show', isOpen);\n    document.body.style.overflow = isOpen ? 'hidden' : '';\n  });\n  drawer.querySelectorAll('a').forEach((a) => a.addEventListener('click', closeDrawer));\n  window.addEventListener('resize', () => { if (window.innerWidth > 900) closeDrawer(); });\n}\n\n// ---------- Smooth anchor scroll offset ----------\ndocument.querySelectorAll('a[href^=\"#\"]').forEach((a) => {\n  a.addEventListener('click', (e) => {\n    const id = a.getAttribute('href');\n    if (id.length < 2) return;\n    const t = document.querySelector(id);\n    if (!t) return;\n    e.preventDefault();\n    const y = t.getBoundingClientRect().top + window.scrollY - 70;\n    window.scrollTo({ top: y, behavior: 'smooth' });\n  });\n});\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
